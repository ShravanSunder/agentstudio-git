name: Check

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  check:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install tooling
        run: brew install mise cmake

      - name: Run package checks
        run: mise run check

      - name: Run AddressSanitizer tests
        run: mise run test-asan

      - name: Run ThreadSanitizer tests
        run: mise run test-tsan

      - name: Verify downstream package consumer
        run: bash scripts/verify-package-consumer.sh
