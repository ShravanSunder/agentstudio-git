name: Check

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  check:
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install tooling
        run: brew install mise cmake swift-format swiftlint

      - name: Run package checks
        run: mise run check

      - name: Run AddressSanitizer tests
        run: mise run test-asan

      - name: Run ThreadSanitizer tests
        run: mise run test-tsan

      - name: Verify downstream package consumer
        run: bash scripts/verify-package-consumer.sh

      - name: Report AgentStudio compatibility external gate
        if: ${{ env.AGENTSTUDIO_GIT_AGENTSTUDIO_PATH == '' }}
        run: echo "AgentStudio compatibility requires AGENTSTUDIO_GIT_AGENTSTUDIO_PATH and is not proven by this CI checkout."

      - name: Verify AgentStudio compatibility
        if: ${{ env.AGENTSTUDIO_GIT_AGENTSTUDIO_PATH != '' }}
        run: bash scripts/verify-agentstudio-compatibility.sh
