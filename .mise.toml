[env]
PROJECT_ROOT = "{{config_root}}"

[tasks.format]
description = "Format Swift sources with swift-format"
run = """
swift-format format --in-place --recursive Sources/ Tests/
echo "Formatted all Swift sources"
"""

[tasks.lint]
description = "Lint Swift sources with swift-format and SwiftLint"
run = """
#!/usr/bin/env bash
set -euo pipefail
echo "--- swift-format lint ---"
swift-format lint --recursive Sources/ Tests/ 2>&1 && echo "swift-format: OK" || { echo "swift-format: FAIL"; exit 1; }
echo "--- swiftlint ---"
swiftlint lint --strict 2>&1 && echo "swiftlint: OK" || { echo "swiftlint: FAIL"; exit 1; }
"""

[tasks.build]
description = "Build the Swift package"
run = "swift build"

[tasks.test]
description = "Run Swift Testing suites"
run = "bash scripts/run-swift-test-suites.sh"

[tasks.test-asan]
description = "Run Swift wrapper tests with AddressSanitizer"
run = "bash scripts/run-swift-test-suites.sh --sanitize address --disable-xctest"

[tasks.test-tsan]
description = "Run Swift wrapper tests with ThreadSanitizer"
run = "bash scripts/run-swift-test-suites.sh --sanitize thread --disable-xctest"

[tasks.build-libgit2]
description = "Build the pinned local-only libgit2 XCFramework"
run = "bash scripts/build-libgit2-xcframework.sh"

[tasks.verify-libgit2]
description = "Verify the local libgit2 XCFramework"
depends = ["build-libgit2"]
run = "bash scripts/verify-libgit2-artifact.sh"

[tasks.verify-package-consumer]
description = "Verify downstream SwiftPM consumption and release manifest shape"
run = "bash scripts/verify-package-consumer.sh"

[tasks.verify-agentstudio-compatibility]
description = "Verify the exact SDK candidate through AgentStudio's real compiled consumer suites"
run = "bash scripts/verify-agentstudio-compatibility.sh"

[tasks.verify-live-remote-auth]
description = "Verify live HTTPS credential-helper and SSH-agent remote/auth behavior"
run = "bash scripts/verify-live-remote-auth.sh"

[tasks.verify-hosted-libgit2-artifact]
description = "Verify hosted HTTPS/checksum libgit2 artifact consumption"
run = "bash scripts/verify-hosted-libgit2-artifact.sh"

[tasks.check]
description = "Run build, lint, and tests"
run = """
#!/usr/bin/env bash
set -euo pipefail
mise run verify-libgit2
mise run build
mise run lint
mise run test
"""
